
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>Ma To-Do List</h1>
            <p>Organise tes journées, une tâche à la fois !</p>
        </header>

        <div class="todo-box">

            <form id="todo-form">
                <input
                    type="text"
                    id="task-input"
                    placeholder="Ajouter une nouvelle tâche..."
                    autocomplete="off"
                >

                <button type="submit">Ajouter +</button>
            </form>

            <div class="task-info">
                <span id="task-count">0 tâche restante</span>
            </div>

            <div class="filters">
                <button class="filter active" data-filter="all">
                    Toutes
                </button>

                <button class="filter" data-filter="active">
                    En cours
                </button>

                <button class="filter" data-filter="completed">
                    Terminées
                </button>
            </div>

            <ul id="task-list"></ul>

            <p id="empty-message">
                Aucune tâche pour le moment.
            </p>

        </div>

        <footer>
            <p>Créé avec HTML, CSS et JavaScript ❤️</p>
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
