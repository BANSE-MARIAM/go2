<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <title>Shopping Cart</title>
</head>

<body>

    <header>
        <nav class="navbar navbar-light bg-light">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Shopping Cart</a>
            </div>
        </nav>
    </header>

    <main>

        <section class="shopping-card-container">

            <div class="total-price">
                <span>Total Price : </span>
                <span class="total">0 $</span>
            </div>

            <div class="list-products">

                <!-- Produit 1 -->
                <div class="card-body">
                    <div class="card" style="width: 18rem;">
                        <img src="baskets.png" class="card-img-top" alt="Baskets">

                        <div class="card-body">
                            <h5 class="card-title">Baskets</h5>
                            <p class="card-text">Chaussures de sport</p>

                            <h4 class="unit-price">100 $</h4>

                            <div>
                                <i class="fas fa-plus-circle"></i>
                                <span class="quantity">0</span>
                                <i class="fas fa-minus-circle"></i>
                            </div>

                            <div>
                                <i class="fas fa-trash-alt"></i>
                                <i class="fas fa-heart"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Produit 2 -->
                <div class="card-body">
                    <div class="card" style="width: 18rem;">
                        <img src="socks.png" class="card-img-top" alt="Chaussettes">

                        <div class="card-body">
                            <h5 class="card-title">Socks</h5>
                            <p class="card-text">Chaussettes confortables</p>

                            <h4 class="unit-price">20 $</h4>

                            <div>
                                <i class="fas fa-plus-circle"></i>
                                <span class="quantity">0</span>
                                <i class="fas fa-minus-circle"></i>
                            </div>

                            <div>
                                <i class="fas fa-trash-alt"></i>
                                <i class="fas fa-heart"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Produit 3 -->
                <div class="card-body">
                    <div class="card" style="width: 18rem;">
                        <img src="bag.png" class="card-img-top" alt="Sac">

                        <div class="card-body">
                            <h5 class="card-title">Bag</h5>
                            <p class="card-text">Sac élégant</p>

                            <h4 class="unit-price">50 $</h4>

                            <div>
                                <i class="fas fa-plus-circle"></i>
                                <span class="quantity">0</span>
                                <i class="fas fa-minus-circle"></i>
                            </div>

                            <div>
                                <i class="fas fa-trash-alt"></i>
                                <i class="fas fa-heart"></i>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

        </section>

    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript -->
    <script src="dom1.js"></script>

</body>
</html>
