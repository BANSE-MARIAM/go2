<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silence — Damso feat. Angèle</title>
<style>
  :root { --bg:#0e0b09; --card:#1a1411; --fire:#ff6a1a; --ember:#ffb347; --text:#f5ece4; --muted:#a8968a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { min-height:100vh; display:grid; place-items:center; font-family:Georgia, serif;
    background:radial-gradient(circle at 50% 110%, #4a1d08 0%, var(--bg) 60%); color:var(--text); }
  .player { width:340px; background:var(--card); border-radius:24px; padding:24px;
    box-shadow:0 30px 80px -20px rgba(255,106,26,.35); }
  .cover { width:100%; aspect-ratio:1; border-radius:16px; object-fit:cover; display:block;
    background:linear-gradient(160deg,#2b1408,#ff6a1a 70%,#ffd27a); }
  .cover-wrap { position:relative; }
  .cover-label { position:absolute; inset:auto 0 0 0; padding:16px; font-size:12px; letter-spacing:.3em;
    text-transform:uppercase; color:rgba(255,255,255,.8); }
  h1 { margin-top:20px; font-size:26px; }
  .artist { color:var(--muted); letter-spacing:.2em; text-transform:uppercase; font-size:13px; margin-top:4px; font-family:system-ui,sans-serif; }
  .bar { margin-top:22px; height:6px; background:#2f2520; border-radius:3px; cursor:pointer; }
  .fill { height:100%; width:0; border-radius:3px; background:linear-gradient(90deg,var(--fire),var(--ember)); }
  .times { display:flex; justify-content:space-between; font:12px system-ui,sans-serif; color:var(--muted); margin-top:6px; }
  .play { margin:18px auto 0; display:grid; place-items:center; width:68px; height:68px; border:none; border-radius:50%;
    background:var(--fire); color:var(--bg); font-size:24px; cursor:pointer; transition:transform .15s; }
  .play:hover { transform:scale(1.07); }
  .files { margin-top:20px; font:12px system-ui,sans-serif; color:var(--muted); display:grid; gap:8px; }
  .files label { cursor:pointer; text-decoration:underline; }
  .files input { display:none; }
</style>
</head>
<body>
  <div class="player">
    <div class="cover-wrap">
      <video id="video" class="cover" playsinline preload="metadata"
        poster="https://upload.wikimedia.org/wikipedia/commons/2/27/Festival_des_Vieilles_Charrues_2018_-_Damso_-_009_%28cropped%29.jpg">
        <source src="Damso%20feat.%20Ang%C3%A8le%20-%20Silence%20(Clip%20Vid%C3%A9o).mp4" type="video/mp4">
        Votre navigateur ne prend pas en charge la lecture vidéo.
      </video>
      <span class="cover-label">Damso</span>
    </div>
    <h1>Silence</h1>
    <p class="artist">Damso feat. Angèle</p>
    <div class="bar" id="bar"><div class="fill" id="fill"></div></div>
    <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
    <button class="play" id="play" aria-label="Lecture">▶</button>
    <div class="files">
      <label>🎬 Choisir une vidéo<input type="file" id="videoFile" accept="video/*"></label>
      <label>🖼️ Choisir l’affiche<input type="file" id="imgFile" accept="image/*"></label>
    </div>
  </div>
<script>
  const video = document.getElementById('video'), play = document.getElementById('play'),
        fill = document.getElementById('fill'), bar = document.getElementById('bar'),
        cur = document.getElementById('cur'), dur = document.getElementById('dur');
  const fmt = s => isNaN(s) ? '0:00' : Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0');

  document.getElementById('videoFile').onchange = e => {
    const f = e.target.files[0];
    if (f) {
      video.src = URL.createObjectURL(f);
      video.load();
    }
  };
  document.getElementById('imgFile').onchange = e => {
    const f = e.target.files[0];
    if (f) video.poster = URL.createObjectURL(f);
  };

  play.onclick = () => {
    if (video.paused) {
      video.play().catch(error => {
        console.error('Échec de la lecture vidéo :', error);
        alert('La vidéo n’a pas pu être lue. Vérifie que le fichier est disponible et compatible.');
      });
    } else {
      video.pause();
    }
  };
  video.onplay = () => { play.textContent = '❚❚'; play.setAttribute('aria-label','Pause'); };
  video.onpause = () => { play.textContent = '▶'; play.setAttribute('aria-label','Lecture'); };
  video.onloadedmetadata = () => dur.textContent = fmt(video.duration);
  video.ontimeupdate = () => {
    fill.style.width = (video.currentTime / video.duration * 100 || 0) + '%';
    cur.textContent = fmt(video.currentTime);
  };
  bar.onclick = e => {
    if (video.duration) video.currentTime = (e.offsetX / bar.clientWidth) * video.duration;
  };
</script>
</body>
</html>
